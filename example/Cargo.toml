[package]
name = "example"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "basic"

[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "macros"
path = "src/bin/macros.rs"
required-features = ["macros"]

[[bin]]
name = "serde"
path = "src/bin/serde.rs"
required-features = ["serde_json"]
[features]
default = []
macros = ["deltapatcher/macros"]
serde_json = ["dep:serde_json"]

[dependencies]
rand = "0.10.2"
serde_json = { version = "1.0.151", optional = true }

[dependencies.deltapatcher]
workspace = true
