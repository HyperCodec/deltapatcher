[package]
name = "deltapatcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Compute, aggregate, and patch typed deltas between states with timelines, caching, and efficient bidirectional seeking."
readme = "../README.md"
keywords = ["delta", "diff", "patch", "state", "timeline"]
categories = ["data-structures", "algorithms"]
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
deltapatcher-macros = { workspace = true, optional = true }

[dependencies.serde]
version = "1.0.229"
optional = true
features = ["derive"] 

[dependencies.deku]
version = "0.20.3"
optional = true
default-features = false
features = ["bits"]

[features]
default = ["std", "macros"]
alloc = ["deku/alloc"]
std = ["alloc", "deku/std"]
serde = ["dep:serde"]
macros = ["dep:deltapatcher-macros"]
deku = ["dep:deku"]
